name: Supabase keep-alive

# Supabase pauses free projects after a week without activity. A tiny REST
# request once a day keeps the watch-party relay awake without any traffic from
# users. Enable it by adding two repository variables (Settings -> Secrets and
# variables -> Actions -> Variables):
#
#   WATCHPARTY_SUPABASE_URL  https://<project>.supabase.co
#   WATCHPARTY_SUPABASE_KEY  the publishable (anon) key used by the app
#
# The workflow only needs a public key, which is already shipped in the exe.
# When the variables are missing (forks, local copies), the job reports a
# warning and succeeds instead of failing every night.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          WATCHPARTY_SUPABASE_URL: ${{ vars.WATCHPARTY_SUPABASE_URL }}
          WATCHPARTY_SUPABASE_KEY: ${{ vars.WATCHPARTY_SUPABASE_KEY }}
        run: |
          if [ -z "$WATCHPARTY_SUPABASE_URL" ] || [ -z "$WATCHPARTY_SUPABASE_KEY" ]; then
            echo "::warning::Supabase keep-alive is skipped: set the WATCHPARTY_SUPABASE_URL and WATCHPARTY_SUPABASE_KEY repository variables to enable it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping the project
        if: steps.config.outputs.configured == 'true'
        env:
          WATCHPARTY_SUPABASE_URL: ${{ vars.WATCHPARTY_SUPABASE_URL }}
          WATCHPARTY_SUPABASE_KEY: ${{ vars.WATCHPARTY_SUPABASE_KEY }}
        run: |
          url="${WATCHPARTY_SUPABASE_URL%/}"
          # /rest/v1/ answers with the OpenAPI document for any valid key and
          # never touches a table, so the ping cannot mutate user data.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            --header "apikey: $WATCHPARTY_SUPABASE_KEY" \
            --header "Authorization: Bearer $WATCHPARTY_SUPABASE_KEY" \
            "$url/rest/v1/" > /dev/null
          echo "Supabase answered; the free project stays awake."
