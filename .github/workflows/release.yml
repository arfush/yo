name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: yo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      body: ${{ steps.version.outputs.body }}
    steps:
      - name: Read release version and notes
        id: version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          message="$(printf '%s\n' "$COMMIT_MESSAGE" | tr -d '\r')"

          first_line="$(printf '%s\n' "$message" | head -n 1)"
          if [[ ! "$first_line" =~ ^release:[[:space:]]*(v?[0-9]+(\.[0-9]+){0,2})[[:space:]]*$ ]]; then
            echo "Commit message must look like: release: 1.2 or release: 1.2.3" >&2
            echo "Optional release notes go on the following lines." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if [[ "$version" != v* ]]; then
            version="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A patch release has three components (v1.2.3). It is published as a
          # pre-release so stable installations do not pick it up as latest.
          prerelease=false
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          # Everything after the first line becomes the GitHub release description.
          # Leading/trailing blank lines are dropped, inner formatting is preserved.
          notes="$(printf '%s\n' "$message" | tail -n +2 | awk '
            { line[NR] = $0 }
            END {
              first = 0
              last = 0
              for (i = 1; i <= NR; i++) {
                if (line[i] ~ /[^[:space:]]/) {
                  if (!first) first = i
                  last = i
                }
              }
              for (i = first; first && i <= last; i++) print line[i]
            }
          ')"

          if [[ -n "$notes" ]]; then
            {
              echo "body<<YO_RELEASE_BODY"
              printf '%s\n' "$notes"
              echo "YO_RELEASE_BODY"
            } >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...

  build:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, 386]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REPO: ${{ github.repository }}
      # Code signing stays optional: without the secret the build is simply
      # unsigned, exactly like a local build without a certificate.
      SIGN_PFX_BASE64: ${{ secrets.YOANIME_SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.YOANIME_SIGN_PFX_PASSWORD }}
      # Repository variables win; otherwise build.ps1 falls back to the checked-in
      # party.json, so a relay deployed once reaches every user without any
      # configuration file on their side.
      YO_CLOUDFLARE_ENDPOINT: ${{ vars.YO_CLOUDFLARE_ENDPOINT }}
      YO_SUPABASE_ENDPOINT: ${{ vars.YO_SUPABASE_ENDPOINT }}
      YO_SUPABASE_PUBKEY: ${{ vars.YO_SUPABASE_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare signing certificate
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          "YOANIME_SIGN_PFX_BASE64=$env:SIGN_PFX_BASE64" >> $env:GITHUB_ENV
          "YOANIME_SIGN_PFX_PASSWORD=$env:SIGN_PFX_PASSWORD" >> $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        run: .\build.ps1 -Version $env:VERSION -Repo $env:REPO -Arch "${{ matrix.arch }}"
      - name: Checksum
        shell: pwsh
        run: |
          $exe = "dist\yo_${env:VERSION}_${{ matrix.arch }}.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $exe)" | Set-Content -NoNewline "$exe.sha256"
      - name: Build installer
        shell: pwsh
        run: |
          .\installer.ps1 -Version $env:VERSION -Arch "${{ matrix.arch }}"
          $setup = "dist\yo_${env:VERSION}_${{ matrix.arch }}_setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $setup)" | Set-Content -NoNewline "$setup.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: yo_${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: [prepare, test, build]
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Every architecture ships two downloads: the portable exe and the
          # installer. A release that lost either of them must not happen.
          missing=0
          for arch in amd64 arm64 386; do
            for file in "dist/yo_${VERSION}_${arch}.exe" "dist/yo_${VERSION}_${arch}_setup.exe"; do
              if [[ -f "$file" ]]; then
                echo "ok: $(basename "$file")"
              else
                echo "::error::missing release asset: $(basename "$file")"
                missing=1
              fi
            done
          done
          exit "$missing"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: yo ${{ needs.prepare.outputs.version }}
          body: ${{ needs.prepare.outputs.body }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.prerelease != 'true' }}
          files: |
            dist/*.exe
            dist/*.sha256
          generate_release_notes: ${{ needs.prepare.outputs.body == '' }}
