# Yonime loads this file with --input-conf for every playback. Each binding is
# assigned to the yonime-no-timeline section, which is disabled by default and
# enabled only for a watch-party guest whose host does not allow shared control.
# It blocks timeline navigation while volume, speed, subtitles, audio tracks,
# fullscreen and other player controls stay available.
#
# Mouse wheel up/down adjusts the volume, so those two bindings are deliberately
# left alone. MBTN_LEFT is also left alone: the OSC owns it, and an "ignore"
# binding here would take clicks away from the fullscreen controls. With the OSC
# disabled, the built-in left click does nothing anyway. DEL would bring the OSC
# back together with its seek bar, so it is blocked here as well.
LEFT {yonime-no-timeline} ignore
RIGHT {yonime-no-timeline} ignore
UP {yonime-no-timeline} ignore
DOWN {yonime-no-timeline} ignore
Shift+LEFT {yonime-no-timeline} ignore
Shift+RIGHT {yonime-no-timeline} ignore
Shift+UP {yonime-no-timeline} ignore
Shift+DOWN {yonime-no-timeline} ignore
Ctrl+LEFT {yonime-no-timeline} ignore
Ctrl+RIGHT {yonime-no-timeline} ignore
HOME {yonime-no-timeline} ignore
PGUP {yonime-no-timeline} ignore
PGDWN {yonime-no-timeline} ignore
Shift+PGUP {yonime-no-timeline} ignore
Shift+PGDWN {yonime-no-timeline} ignore
, {yonime-no-timeline} ignore
. {yonime-no-timeline} ignore
SPACE {yonime-no-timeline} ignore
p {yonime-no-timeline} ignore
PAUSE {yonime-no-timeline} ignore
PLAY {yonime-no-timeline} ignore
PLAYPAUSE {yonime-no-timeline} ignore
PAUSEONLY {yonime-no-timeline} ignore
PLAYONLY {yonime-no-timeline} ignore
FORWARD {yonime-no-timeline} ignore
REWIND {yonime-no-timeline} ignore
Shift+BS {yonime-no-timeline} ignore
Shift+Ctrl+BS {yonime-no-timeline} ignore
l {yonime-no-timeline} ignore
WHEEL_LEFT {yonime-no-timeline} ignore
WHEEL_RIGHT {yonime-no-timeline} ignore
DEL {yonime-no-timeline} ignore
MBTN_RIGHT {yonime-no-timeline} ignore
MBTN_BACK {yonime-no-timeline} ignore
MBTN_FORWARD {yonime-no-timeline} ignore
ENTER {yonime-no-timeline} ignore
< {yonime-no-timeline} ignore
> {yonime-no-timeline} ignore
Shift+HOME {yonime-no-timeline} ignore
Shift+END {yonime-no-timeline} ignore
