# Yonime loads this file with --input-conf for every playback. The section is
# disabled by default and is enabled only for a watch-party guest whose host
# does not allow shared control. It blocks timeline navigation while volume,
# speed, subtitles, audio tracks, fullscreen and other player controls stay
# available.
[yonime-no-timeline]
LEFT ignore
RIGHT ignore
Shift+LEFT ignore
Shift+RIGHT ignore
Ctrl+LEFT ignore
Ctrl+RIGHT ignore
PGUP ignore
PGDN ignore
Shift+PGUP ignore
Shift+PGDN ignore
, ignore
. ignore
SPACE ignore
p ignore
MBTN_LEFT ignore
MBTN_RIGHT ignore
WHEEL_UP ignore
WHEEL_DOWN ignore
