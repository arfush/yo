# yoanime loads this file with --input-conf for every playback. Each binding is
# assigned to the yoanime-no-timeline section, which is disabled by default and
# enabled only for a watch-party guest whose host does not allow shared control.
# It blocks timeline navigation while volume, speed, subtitles, audio tracks,
# fullscreen and other player controls stay available.
#
# Mouse wheel up/down adjusts the volume, so those two bindings are deliberately
# left alone. MBTN_LEFT is also left alone: the OSC owns it, and an "ignore"
# binding here would take clicks away from the fullscreen controls. With the OSC
# disabled, the built-in left click does nothing anyway. DEL would bring the OSC
# back together with its seek bar, so it is blocked here as well.
LEFT {yoanime-no-timeline} ignore
RIGHT {yoanime-no-timeline} ignore
UP {yoanime-no-timeline} ignore
DOWN {yoanime-no-timeline} ignore
Shift+LEFT {yoanime-no-timeline} ignore
Shift+RIGHT {yoanime-no-timeline} ignore
Shift+UP {yoanime-no-timeline} ignore
Shift+DOWN {yoanime-no-timeline} ignore
Ctrl+LEFT {yoanime-no-timeline} ignore
Ctrl+RIGHT {yoanime-no-timeline} ignore
HOME {yoanime-no-timeline} ignore
PGUP {yoanime-no-timeline} ignore
PGDWN {yoanime-no-timeline} ignore
Shift+PGUP {yoanime-no-timeline} ignore
Shift+PGDWN {yoanime-no-timeline} ignore
, {yoanime-no-timeline} ignore
. {yoanime-no-timeline} ignore
SPACE {yoanime-no-timeline} ignore
p {yoanime-no-timeline} ignore
PAUSE {yoanime-no-timeline} ignore
PLAY {yoanime-no-timeline} ignore
PLAYPAUSE {yoanime-no-timeline} ignore
PAUSEONLY {yoanime-no-timeline} ignore
PLAYONLY {yoanime-no-timeline} ignore
FORWARD {yoanime-no-timeline} ignore
REWIND {yoanime-no-timeline} ignore
Shift+BS {yoanime-no-timeline} ignore
Shift+Ctrl+BS {yoanime-no-timeline} ignore
l {yoanime-no-timeline} ignore
WHEEL_LEFT {yoanime-no-timeline} ignore
WHEEL_RIGHT {yoanime-no-timeline} ignore
DEL {yoanime-no-timeline} ignore
MBTN_RIGHT {yoanime-no-timeline} ignore
MBTN_BACK {yoanime-no-timeline} ignore
MBTN_FORWARD {yoanime-no-timeline} ignore
ENTER {yoanime-no-timeline} ignore
< {yoanime-no-timeline} ignore
> {yoanime-no-timeline} ignore
Shift+HOME {yoanime-no-timeline} ignore
Shift+END {yoanime-no-timeline} ignore
